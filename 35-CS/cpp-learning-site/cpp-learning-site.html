<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C++ 학습 사이트 · llm-wiki</title>
  <meta name="description" content="입문부터 모던 C++까지 — 코드 예제와 퀴즈로 배우는 C++ 학습 사이트" />
  <style>
/* ===== 테마 변수 ===== */
:root {
  --bg: #f7f8fa;
  --bg-elev: #ffffff;
  --bg-code: #1e1e2e;
  --text: #1d2230;
  --text-dim: #5b6472;
  --border: #e3e6ec;
  --accent: #2563eb;
  --accent-soft: #dbe7ff;
  --green: #16a34a;
  --green-soft: #dcfce7;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --red: #dc2626;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
  --radius: 12px;
  --sidebar-w: 280px;
  --top-h: 56px;
}
[data-theme="dark"] {
  --bg: #0f1117;
  --bg-elev: #171a23;
  --bg-code: #11131a;
  --text: #e6e9ef;
  --text-dim: #9aa3b2;
  --border: #262b38;
  --accent: #5b8cff;
  --accent-soft: #1c2740;
  --green: #4ade80;
  --green-soft: #14321f;
  --amber: #fbbf24;
  --amber-soft: #36280c;
  --red: #f87171;
  --shadow: 0 2px 8px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ===== 상단 바 ===== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--top-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 16px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-weight: 700; }
.logo {
  background: var(--accent); color: #fff; font-weight: 800;
  padding: 3px 8px; border-radius: 8px; font-size: 15px; letter-spacing: -.5px;
}
.brand-text { font-size: 15px; }
.icon-btn {
  background: transparent; border: 1px solid transparent; cursor: pointer;
  font-size: 19px; padding: 6px 9px; border-radius: 8px; color: var(--text);
}
.icon-btn:hover { background: var(--bg); border-color: var(--border); }
#menuToggle { display: none; }

.search-wrap { position: relative; margin-left: auto; width: min(340px, 42vw); }
#search {
  width: 100%; padding: 8px 12px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 14px; outline: none;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-results {
  position: absolute; top: 110%; left: 0; right: 0; margin: 0; padding: 6px; list-style: none;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 40;
}
.search-results li { padding: 9px 11px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.search-results li:hover, .search-results li.active { background: var(--accent-soft); }
.search-results .sr-stage { color: var(--text-dim); font-size: 12px; }
.search-results .empty { color: var(--text-dim); cursor: default; }

/* ===== 진행도 바 ===== */
.progress-bar { height: 3px; background: var(--border); position: sticky; top: var(--top-h); z-index: 25; }
.progress-fill { height: 100%; width: 0; background: var(--green); transition: width .35s ease; }

/* ===== 레이아웃 ===== */
.layout { display: flex; max-width: 1180px; margin: 0 auto; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  position: sticky; top: calc(var(--top-h) + 3px);
  height: calc(100vh - var(--top-h) - 3px);
  overflow-y: auto; padding: 18px 14px;
  border-right: 1px solid var(--border);
}
.progress-text { font-size: 13px; color: var(--text-dim); margin: 0 8px 12px; display: flex; align-items: center; gap: 8px; }
.progress-text strong { color: var(--text); }
.link-btn { margin-left: auto; background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; }
.link-btn:hover { text-decoration: underline; }

.nav-stage { margin-bottom: 6px; }
.nav-stage-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 700; text-transform: none;
  color: var(--text-dim); padding: 10px 8px 4px; letter-spacing: .2px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; margin: 1px 0; border-radius: 8px;
  cursor: pointer; font-size: 14px; color: var(--text); text-decoration: none;
}
.nav-item:hover { background: var(--bg); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-check { width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%;
  border: 1.5px solid var(--border); display: grid; place-items: center; font-size: 10px; color: #fff; }
.nav-item.done .nav-check { background: var(--green); border-color: var(--green); }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }

/* ===== 본문 ===== */
.content { flex: 1; min-width: 0; padding: 28px 36px 60px; }
.lesson { max-width: 760px; margin: 0 auto; }
.lesson .crumb { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.lesson h1 { font-size: 30px; margin: 4px 0 6px; letter-spacing: -.6px; line-height: 1.25; }
.lesson .summary { color: var(--text-dim); font-size: 16px; margin: 0 0 22px; }
.lesson h3 { font-size: 18px; margin: 26px 0 8px; }
.lesson p { margin: 10px 0; }
.lesson ul, .lesson ol { padding-left: 22px; }
.lesson li { margin: 5px 0; }
.lesson code {
  background: var(--accent-soft); color: var(--accent);
  padding: 1.5px 6px; border-radius: 5px; font-size: 13.5px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
}
[data-theme="dark"] .lesson code { color: #bcd0ff; }
pre.mini { background: var(--bg-elev); border: 1px dashed var(--border);
  padding: 8px 12px; border-radius: 8px; font-size: 13px; overflow-x: auto; }

.tbl { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
.tbl th, .tbl td { border: 1px solid var(--border); padding: 8px 11px; text-align: left; }
.tbl th { background: var(--bg); font-weight: 600; }

.callout {
  background: var(--accent-soft); border-left: 4px solid var(--accent);
  padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 16px 0; font-size: 14.5px;
}
.callout.warn { background: var(--amber-soft); border-left-color: var(--amber); }

/* ===== 코드 블록 ===== */
.code-block { margin: 18px 0; border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border); box-shadow: var(--shadow); }
.code-head {
  display: flex; align-items: center; gap: 8px;
  background: #2a2a3d; color: #c8c8d8; padding: 7px 14px; font-size: 12.5px;
}
[data-theme="dark"] .code-head { background: #1a1c26; }
.code-head .dot { width: 11px; height: 11px; border-radius: 50%; }
.code-head .dot.r { background: #ff5f56; } .code-head .dot.y { background: #ffbd2e; } .code-head .dot.g { background: #27c93f; }
.code-head .lang { margin-left: 6px; }
.copy-btn { margin-left: auto; background: rgba(255,255,255,.12); color: #fff;
  border: none; padding: 4px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.copy-btn:hover { background: rgba(255,255,255,.24); }
.copy-btn.copied { background: var(--green); }
pre.code {
  margin: 0; background: var(--bg-code); color: #ececf6;
  padding: 18px 20px; overflow-x: auto; font-size: 14.5px; line-height: 1.8;
  font-family: "JetBrains Mono", "Fira Code", "D2Coding", Consolas, monospace;
  tab-size: 4; -moz-tab-size: 4;
}
/* 코드 블록 안의 <code> 는 인라인 코드 스타일(연파랑 배경)을 물려받지 않게 초기화
   (이게 없으면 각 줄마다 연파랑 띠가 생겨 코드가 잘 안 보인다) */
pre.code code {
  background: none; padding: 0; border-radius: 0;
  color: inherit; font-size: inherit; font-family: inherit;
}
/* 코드 선택(드래그) 시에도 또렷하게 */
pre.code::selection, pre.code *::selection { background: #3a5bd9; color: #fff; }
/* 명령어(bash) 블록은 구문강조 없이 단색으로 깔끔하게 */
pre.code.plain { color: #d7e0c4; white-space: pre; }
.code-note { font-size: 13.5px; color: var(--text-dim); margin: -6px 0 0; padding: 0 2px; }
.code-note::before { content: "💡 "; }

/* 구문 강조 토큰 (어두운 코드 배경에서 또렷하도록 대비 강화) */
.tok-key { color: #d8a6ff; } .tok-str { color: #c8e89a; }
.tok-num { color: #ff9d7a; } .tok-com { color: #9aa3bd; font-style: italic; }
.tok-pre { color: #8fdcff; } .tok-fn { color: #93b4ff; } .tok-type { color: #ffd27a; }

/* ===== 퀴즈 ===== */
.quiz { background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin: 22px 0; }
.quiz-title { font-weight: 700; font-size: 16px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
.quiz-q { margin-bottom: 18px; }
.quiz-q:last-child { margin-bottom: 0; }
.quiz-q p { font-weight: 600; margin: 0 0 9px; }
.quiz-opt {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 9px 13px; border-radius: 9px; margin: 6px 0; font-size: 14px; transition: .12s;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); }
.quiz-opt.correct { background: var(--green-soft); border-color: var(--green); font-weight: 600; }
.quiz-opt.wrong { background: #fde8e8; border-color: var(--red); }
[data-theme="dark"] .quiz-opt.wrong { background: #3a1414; }
.quiz-explain { font-size: 13.5px; color: var(--text-dim); margin: 8px 2px 0;
  padding: 9px 12px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--accent); }
.quiz-explain.hidden { display: none; }

/* ===== 강의 하단 내비 ===== */
.lesson-nav { max-width: 760px; margin: 30px auto 0; display: flex; gap: 10px; align-items: center; }
.nav-btn { background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
  padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; }
.complete-btn { flex: 1; background: var(--accent); color: #fff; border: none;
  padding: 11px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; }
.complete-btn:hover { filter: brightness(1.07); }
.complete-btn.done { background: var(--green); }

.footer { max-width: 760px; margin: 40px auto 0; padding-top: 20px;
  border-top: 1px solid var(--border); color: var(--text-dim); font-size: 13px; text-align: center; }

/* ===== 종합 퀴즈 코너 ===== */
.nav-item.quiz-link { font-weight: 600; margin-bottom: 8px; background: var(--bg); }
.nav-item.quiz-link.active { background: var(--accent-soft); color: var(--accent); }
.nav-check.quiz-ic { border: none; font-size: 14px; background: transparent; }

.qz-tabs { display: flex; gap: 8px; margin: 18px 0 6px; }
.qz-tab {
  flex: 1; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
  padding: 11px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.qz-tab:hover { border-color: var(--accent); }
.qz-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.qz-tab .cnt {
  font-size: 12px; background: rgba(0,0,0,.12); padding: 1px 8px; border-radius: 20px; font-weight: 700;
}
.qz-tab.active .cnt { background: rgba(255,255,255,.25); }

.qz-score {
  font-size: 14px; color: var(--text-dim); margin: 10px 2px 18px;
  display: flex; align-items: center; gap: 10px;
}
.qz-score strong { color: var(--green); font-size: 17px; }

.quiz-q.qz {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin: 14px 0;
}
.quiz-q .q-num {
  display: inline-grid; place-items: center; width: 24px; height: 24px;
  background: var(--accent); color: #fff; border-radius: 50%;
  font-size: 13px; font-weight: 700; margin-right: 6px; vertical-align: middle;
}
.badge {
  font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); margin-right: 6px; vertical-align: middle;
}
.badge.fill-badge { background: var(--amber-soft); color: var(--amber); }
pre.code.qz-code { margin: 12px 0; border-radius: 10px; font-size: 13px; }
.quiz-opt code { background: transparent; color: inherit; padding: 0; }

.fill-row { display: flex; gap: 8px; margin-top: 12px; }
.fill-input {
  flex: 1; padding: 10px 13px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px;
  font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; outline: none;
}
.fill-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fill-input.ok { border-color: var(--green); }
.fill-input.ng { border-color: var(--red); }
.fill-check {
  background: var(--accent); color: #fff; border: none; padding: 0 18px;
  border-radius: 9px; cursor: pointer; font-size: 14px; font-weight: 600;
}
.fill-check:hover:not(:disabled) { filter: brightness(1.08); }
.fill-check:disabled { opacity: .5; cursor: not-allowed; }
.fill-feedback { font-size: 13.5px; font-weight: 600; margin: 9px 2px 0; }
.fill-feedback.ok { color: var(--green); }
.fill-feedback.ng { color: var(--red); }
.fill-feedback.hidden { display: none; }

/* ===== 반응형 ===== */
@media (max-width: 820px) {
  #menuToggle { display: inline-block; }
  .brand-text { display: none; }
  .sidebar {
    position: fixed; left: 0; top: var(--top-h); bottom: 0; z-index: 25;
    background: var(--bg-elev); width: 84vw; max-width: 320px; height: auto;
    transform: translateX(-100%); transition: transform .25s ease;
  }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow); }
  .content { padding: 22px 18px 50px; }
  .lesson h1 { font-size: 25px; }
  .search-wrap { width: 46vw; }
}

</style>
</head>
<body>
  <!-- 상단 바 -->
  <header class="topbar">
    <button id="menuToggle" class="icon-btn" aria-label="메뉴 열기">☰</button>
    <a class="brand" href="#intro">
      <span class="logo">C++</span>
      <span class="brand-text">학습 사이트</span>
    </a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="강의 검색…" autocomplete="off" />
      <ul id="searchResults" class="search-results" hidden></ul>
    </div>
    <button id="themeToggle" class="icon-btn" aria-label="테마 전환" title="다크/라이트">🌙</button>
  </header>

  <!-- 진행도 바 -->
  <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>

  <div class="layout">
    <!-- 사이드바 -->
    <aside id="sidebar" class="sidebar">
      <div class="progress-text">
        진행도 <strong id="progressCount">0/0</strong>
        <button id="resetProgress" class="link-btn" title="진행도 초기화">초기화</button>
      </div>
      <nav id="nav" class="nav"><!-- JS가 채움 --></nav>
    </aside>
    <div id="overlay" class="overlay" hidden></div>

    <!-- 본문 -->
    <main class="content">
      <!-- 강의 뷰 -->
      <div id="lessonView">
        <article id="lesson" class="lesson"><!-- JS가 채움 --></article>

        <div class="lesson-nav">
          <button id="prevBtn" class="nav-btn">← 이전</button>
          <button id="completeBtn" class="complete-btn">이 강의 완료 표시 ✓</button>
          <button id="nextBtn" class="nav-btn">다음 →</button>
        </div>
      </div>

      <!-- 종합 퀴즈 뷰 -->
      <div id="quizView" hidden><!-- JS가 채움 --></div>

      <footer class="footer">
        <p>llm-wiki · 35-CS · C++ 학습 사이트 — 외부 라이브러리 없이 동작하는 정적 사이트</p>
      </footer>
    </main>
  </div>
  <script>
/* =====================================================================
 *  C++ 학습 사이트 — 강의 콘텐츠 데이터
 *  각 강의: { id, title, summary, body(HTML), code, codeNote, quiz[] }
 *  단계(stage)별로 묶여 사이드바에 표시된다.
 * ===================================================================== */

const CURRICULUM = [
  {
    stage: "1. 입문",
    icon: "🚀",
    lessons: [
      {
        id: "intro",
        title: "C++ 란 무엇인가",
        summary: "C++의 역사와 특징, 어디에 쓰이는지.",
        body: `
<p><strong>C++</strong>는 1983년 Bjarne Stroustrup가 C 언어를 확장해 만든 언어로,
"C with Classes"에서 출발했다. C의 빠른 속도와 저수준 제어 능력을 그대로 가지면서
<em>객체지향</em>, <em>제네릭(템플릿)</em>, 그리고 현대적인 추상화까지 지원한다.</p>
<h3>왜 C++ 인가</h3>
<ul>
  <li><strong>성능</strong> — 가비지 컬렉터 없이 메모리를 직접 다뤄 매우 빠르다.</li>
  <li><strong>제어</strong> — 하드웨어/메모리에 가까운 저수준 제어가 가능하다.</li>
  <li><strong>범용성</strong> — 게임 엔진, 운영체제, 임베디드, 금융, 시뮬레이션 등에 쓰인다.</li>
</ul>
<h3>"제로 오버헤드" 원칙</h3>
<p>C++의 철학은 <em>"쓰지 않는 기능에는 비용을 내지 않는다"</em>이다.
추상화를 제공하되, 그 추상화가 런타임 성능을 깎지 않도록 설계되어 있다.</p>
<div class="callout">기계공학·시뮬레이션·수치해석처럼 <strong>속도가 중요한 계산</strong>에 C++가 자주 쓰인다.
이 위키의 <code>25-Math/NumericalAnalysis</code> 와 잘 어울린다.</div>
`,
        code: `// 모든 C++ 프로그램은 main() 에서 시작한다.
#include <iostream>   // 입출력 라이브러리

int main() {
    std::cout << "Hello, C++!" << std::endl;
    return 0;          // 0 = 정상 종료
}`,
        codeNote: "std::cout 으로 콘솔에 출력하고, std::endl 로 줄을 바꾼다.",
        quiz: [
          {
            q: "C++ 프로그램의 실행이 시작되는 함수는?",
            options: ["start()", "main()", "begin()", "run()"],
            answer: 1,
            explain: "모든 C++ 프로그램은 main() 함수에서 실행을 시작한다."
          },
          {
            q: "C++의 핵심 철학 '제로 오버헤드 원칙'이 뜻하는 것은?",
            options: [
              "모든 코드는 0초에 실행된다",
              "쓰지 않는 기능에는 비용을 내지 않는다",
              "메모리를 0으로 초기화한다",
              "에러가 0개여야 한다"
            ],
            answer: 1,
            explain: "사용하지 않는 추상화 때문에 성능 손해를 보지 않는다는 의미다."
          }
        ]
      },

/* =====================================================================
 *  C++ 학습 사이트 — 앱 로직 (외부 의존성 없음)
 *  - 사이드바 렌더 / 라우팅(해시) / 강의 렌더
 *  - 자체 C++ 구문 강조 / 코드 복사
 *  - 퀴즈 채점 / 진행도 저장(localStorage) / 검색 / 테마
 * ===================================================================== */
(function () {
  "use strict";

  const STORE_DONE = "cpp-site-done";
  const STORE_THEME = "cpp-site-theme";

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

  /* ---------- 진행도 상태 ---------- */
  function getDone() {
    try { return new Set(JSON.parse(localStorage.getItem(STORE_DONE) || "[]")); }
    catch { return new Set(); }
  }
  function setDone(set) {
    localStorage.setItem(STORE_DONE, JSON.stringify([...set]));
  }
  let done = getDone();

  /* ---------- HTML 이스케이프 ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ---------- 간단한 C++ 구문 강조 ---------- */
  const KEYWORDS = new Set(("alignas alignof and auto bool break case catch char class const constexpr " +
    "continue decltype default delete do double else enum explicit export extern false float for " +
    "friend goto if inline int long mutable namespace new noexcept nullptr operator override private " +
    "protected public return short signed sizeof static struct switch template this throw true try " +
    "typedef typename union unsigned using virtual void volatile while").split(" "));
  const TYPES = new Set(("std string vector map unordered_map set pair size_t unique_ptr shared_ptr " +
    "weak_ptr ostream istream").split(" "));

  function highlight(src) {
    // 토큰: 공백, 주석, 전처리, 문자열/문자, 숫자, 식별자, 기타 기호
    // (공백을 명시적으로 잡지 않으면 exec 가 건너뛰어 줄바꿈이 사라진다)
    const re = /(\s+)|(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(#[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d[\d.'eExXa-fA-F]*\b)|([A-Za-z_]\w*)|([^\sA-Za-z0-9_])/g;
    let out = "";
    let m;
    while ((m = re.exec(src)) !== null) {
      if (m[1]) out += m[1];                                            // 공백/줄바꿈 그대로
      else if (m[2]) out += `<span class="tok-com">${esc(m[2])}</span>`; // 주석
      else if (m[3]) out += `<span class="tok-pre">${esc(m[3])}</span>`; // 전처리
      else if (m[4]) out += `<span class="tok-str">${esc(m[4])}</span>`; // 문자열
      else if (m[5]) out += `<span class="tok-num">${esc(m[5])}</span>`; // 숫자
      else if (m[6]) {
        const w = m[6];
        if (KEYWORDS.has(w)) out += `<span class="tok-key">${w}</span>`;
        else if (TYPES.has(w)) out += `<span class="tok-type">${w}</span>`;
        else {
          // 뒤에 ( 가 오면 함수로 간주
          const after = src.slice(re.lastIndex);
          if (/^\s*\(/.test(after)) out += `<span class="tok-fn">${w}</span>`;
          else out += w;
        }
      } else out += esc(m[7]);
    }
    return out;
  }

  /* ---------- 코드 블록 렌더 ---------- */
  function renderCode(code, note, lang) {
    lang = lang || "cpp";
    const noteHtml = note ? `<p class="code-note">${esc(note)}</p>` : "";
    const isCpp = lang === "cpp";
    const label = isCpp ? "C++" : "bash";
    const inner = isCpp ? highlight(code) : esc(code);
    return `
      <div class="code-block">
        <div class="code-head">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="lang">${label}</span>
          <button class="copy-btn" type="button">복사</button>
        </div>
        <pre class="code ${isCpp ? "" : "plain"}"><code>${inner}</code></pre>
      </div>
      ${noteHtml}`;
  }

  /* ---------- 퀴즈 렌더 ---------- */
  function renderQuiz(quiz, lessonId) {
    if (!quiz || !quiz.length) return "";
    const qs = quiz.map((q, qi) => {
      const opts = q.options.map((o, oi) =>
        `<button class="quiz-opt" data-q="${qi}" data-o="${oi}" type="button">${esc(o)}</button>`
      ).join("");
      return `
        <div class="quiz-q" data-answer="${q.answer}" data-qi="${qi}">
          <p>${qi + 1}. ${esc(q.q)}</p>
          ${opts}
          <div class="quiz-explain hidden">${esc(q.explain)}</div>
        </div>`;
    }).join("");
    return `<div class="quiz" data-lesson="${lessonId}">
      <p class="quiz-title">📝 확인 퀴즈</p>${qs}</div>`;
  }

  /* ---------- 강의 렌더 ---------- */
  function renderLesson(id) {
    const idx = FLAT_LESSONS.findIndex(l => l.id === id);
    const lesson = idx >= 0 ? FLAT_LESSONS[idx] : FLAT_LESSONS[0];
    const realIdx = idx >= 0 ? idx : 0;

    const el = $("#lesson");
    el.innerHTML = `
      <div class="crumb">${esc(lesson.stage)}</div>
      <h1>${esc(lesson.title)}</h1>
      <p class="summary">${esc(lesson.summary)}</p>
      ${lesson.body}
      ${lesson.code ? renderCode(lesson.code, lesson.codeNote, lesson.lang) : ""}
      ${renderQuiz(lesson.quiz, lesson.id)}
    `;
    document.title = `${lesson.title} · C++ 학습 사이트`;
    window.scrollTo({ top: 0, behavior: "smooth" });

    bindCopyButtons(el);
    bindQuiz(el);
    updateLessonNav(realIdx);
    highlightActiveNav(lesson.id);
    closeSidebar();
  }

  /* ---------- 코드 복사 ---------- */
  function bindCopyButtons(scope) {
    $$(".copy-btn", scope).forEach(btn => {
      btn.addEventListener("click", () => {
        const code = btn.closest(".code-block").querySelector("pre.code").innerText;
        const finish = () => {
          btn.textContent = "복사됨 ✓"; btn.classList.add("copied");
          setTimeout(() => { btn.textContent = "복사"; btn.classList.remove("copied"); }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(finish).catch(finish);
        } else {
          const ta = document.createElement("textarea");
          ta.value = code; document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta); finish();
        }
      });
    });
  }

  /* ---------- 퀴즈 채점 ---------- */
  function bindQuiz(scope) {
    $$(".quiz-q", scope).forEach(qBlock => {
      const answer = Number(qBlock.dataset.answer);
      const explain = $(".quiz-explain", qBlock);
      $$(".quiz-opt", qBlock).forEach(opt => {
        opt.addEventListener("click", () => {
          if (qBlock.dataset.answered) return;
          qBlock.dataset.answered = "1";
          const chosen = Number(opt.dataset.o);
          $$(".quiz-opt", qBlock).forEach((o, i) => {
            o.disabled = true;
            if (i === answer) o.classList.add("correct");
          });
          if (chosen !== answer) opt.classList.add("wrong");
          explain.classList.remove("hidden");
        });
      });
    });
  }

  /* ---------- 강의 하단 내비 + 완료 버튼 ---------- */
  let currentIdx = 0;
  function updateLessonNav(idx) {
    currentIdx = idx;
    const prev = $("#prevBtn"), next = $("#nextBtn"), complete = $("#completeBtn");
    prev.disabled = idx === 0;
    next.disabled = idx === FLAT_LESSONS.length - 1;
    const id = FLAT_LESSONS[idx].id;
    const isDone = done.has(id);
    complete.classList.toggle("done", isDone);
    complete.textContent = isDone ? "완료됨 ✓ (클릭해 취소)" : "이 강의 완료 표시 ✓";
  }

  /* =====================================================================
   *  종합 퀴즈 코너 (개념 / 코딩)
   * ===================================================================== */
  function normalize(s) {
    return s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[();]/g, "").trim();
  }

  function renderConceptQ(q, i) {
    const opts = q.options.map((o, oi) =>
      `<button class="quiz-opt" data-o="${oi}" type="button">${esc(o)}</button>`
    ).join("");
    return `<div class="quiz-q qz" data-answer="${q.answer}">
      <p><span class="q-num">${i + 1}</span> ${esc(q.q)}</p>
      ${opts}
      <div class="quiz-explain hidden">${esc(q.explain)}</div>
    </div>`;
  }

  function renderCodingQ(q, i) {
    const codeHtml = q.code ? `<pre class="code qz-code"><code>${highlight(q.code)}</code></pre>` : "";
    if (q.type === "output") {
      const opts = q.options.map((o, oi) =>
        `<button class="quiz-opt" data-o="${oi}" type="button"><code>${esc(o)}</code></button>`
      ).join("");
      return `<div class="quiz-q qz" data-answer="${q.answer}">
        <p><span class="q-num">${i + 1}</span> <span class="badge">출력 예측</span> ${esc(q.q)}</p>
        ${codeHtml}
        ${opts}
        <div class="quiz-explain hidden">${esc(q.explain)}</div>
      </div>`;
    }
    // fill
    const accept = q.accept.map(normalize);
    return `<div class="quiz-q qz fill" data-accept='${esc(JSON.stringify(accept))}'>
      <p><span class="q-num">${i + 1}</span> <span class="badge fill-badge">빈칸 채우기</span> ${esc(q.q)}</p>
      ${codeHtml}
      <div class="fill-row">
        <input class="fill-input" type="text" placeholder="빈칸에 들어갈 코드" autocomplete="off" spellcheck="false" />
        <button class="fill-check" type="button">확인</button>
      </div>
      <div class="fill-feedback hidden"></div>
      <div class="quiz-explain hidden">${esc(q.explain)}</div>
    </div>`;
  }

  let quizTab = "concept";
  function renderQuizPage() {
    const view = $("#quizView");
    const concept = QUIZ_BANK.concept;
    const coding = QUIZ_BANK.coding;
    const total = quizTab === "concept" ? concept.length : coding.length;
    const list = quizTab === "concept"
      ? concept.map(renderConceptQ).join("")
      : coding.map(renderCodingQ).join("");

    view.innerHTML = `
      <div class="lesson">
        <div class="crumb">📝 종합 퀴즈</div>
        <h1>실력 점검 퀴즈</h1>
        <p class="summary">개념 이해와 코드 읽기/쓰기를 나눠서 확인해 보세요. 푼 만큼 점수가 올라갑니다.</p>
        <div class="qz-tabs">
          <button class="qz-tab ${quizTab === "concept" ? "active" : ""}" data-tab="concept">
            개념 문제 <span class="cnt">${concept.length}</span>
          </button>
          <button class="qz-tab ${quizTab === "coding" ? "active" : ""}" data-tab="coding">
            코딩 문제 <span class="cnt">${coding.length}</span>
          </button>
        </div>
        <div class="qz-score">
          이 탭 점수: <strong id="qzScore">0</strong> / ${total}
          <button id="qzReset" class="link-btn">다시 풀기</button>
        </div>
        <div id="qzList">${list}</div>
      </div>`;

    document.title = "종합 퀴즈 · C++ 학습 사이트";
    window.scrollTo({ top: 0, behavior: "smooth" });

    // 탭 전환
    $$(".qz-tab", view).forEach(t => t.addEventListener("click", () => {
      quizTab = t.dataset.tab; renderQuizPage();
    }));
    $("#qzReset").addEventListener("click", renderQuizPage);

    bindQuizScoring(view);
    highlightActiveNav("__quiz__");
    closeSidebar();
  }

  // 종합 퀴즈 채점 + 점수 카운트
  function bindQuizScoring(scope) {
    let score = 0;
    const scoreEl = $("#qzScore", scope);
    const bump = () => { score++; if (scoreEl) scoreEl.textContent = String(score); };

    // 객관식(개념 + 출력 예측)
    $$(".quiz-q.qz:not(.fill)", scope).forEach(block => {
      const answer = Number(block.dataset.answer);
      const explain = $(".quiz-explain", block);
      $$(".quiz-opt", block).forEach(opt => {
        opt.addEventListener("click", () => {
          if (block.dataset.answered) return;
          block.dataset.answered = "1";
          const chosen = Number(opt.dataset.o);
          $$(".quiz-opt", block).forEach((o, i) => {
            o.disabled = true;
            if (i === answer) o.classList.add("correct");
          });
          if (chosen === answer) bump(); else opt.classList.add("wrong");
          explain.classList.remove("hidden");
        });
      });
    });

    // 빈칸 채우기
    $$(".quiz-q.qz.fill", scope).forEach(block => {
      const accept = JSON.parse(block.dataset.accept);
      const input = $(".fill-input", block);
      const btn = $(".fill-check", block);
      const fb = $(".fill-feedback", block);
      const explain = $(".quiz-explain", block);
      const grade = () => {
        if (block.dataset.answered) return;
        const val = normalize(input.value);
        if (!val) return;
        block.dataset.answered = "1";
        input.disabled = true; btn.disabled = true;
        const ok = accept.includes(val);
        fb.classList.remove("hidden");
        if (ok) {
          fb.textContent = "정답입니다! ✓"; fb.classList.add("ok");
          input.classList.add("ok"); bump();
        } else {
          fb.textContent = `오답 — 정답: ${accept[0]}`; fb.classList.add("ng");
          input.classList.add("ng");
        }
        explain.classList.remove("hidden");
      };
      btn.addEventListener("click", grade);
      input.addEventListener("keydown", e => { if (e.key === "Enter") grade(); });
    });
  }

  /* ---------- 사이드바 ---------- */
  function buildNav() {
    const nav = $("#nav");
    const quizLink = `<a class="nav-item quiz-link" href="#quiz" data-id="__quiz__">
        <span class="nav-check quiz-ic">📝</span>
        <span>종합 퀴즈</span>
      </a>`;
    nav.innerHTML = quizLink + CURRICULUM.map(stage => {
      const items = stage.lessons.map(l => `
        <a class="nav-item ${done.has(l.id) ? "done" : ""}" href="#${l.id}" data-id="${l.id}">
          <span class="nav-check">✓</span>
          <span>${esc(l.title)}</span>
        </a>`).join("");
      return `<div class="nav-stage">
        <div class="nav-stage-title">${stage.icon} ${esc(stage.stage)}</div>
        ${items}
      </div>`;
    }).join("");
  }
  function highlightActiveNav(id) {
    $$(".nav-item").forEach(a => a.classList.toggle("active", a.dataset.id === id));
  }
  function refreshNavChecks() {
    $$(".nav-item").forEach(a => a.classList.toggle("done", done.has(a.dataset.id)));
  }
  function updateProgress() {
    const total = FLAT_LESSONS.length;
    const n = FLAT_LESSONS.filter(l => done.has(l.id)).length;
    $("#progressFill").style.width = (total ? (n / total * 100) : 0) + "%";
    $("#progressCount").textContent = `${n}/${total}`;
  }

  /* ---------- 검색 ---------- */
  function setupSearch() {
    const input = $("#search"), box = $("#searchResults");
    let active = -1, results = [];
    const close = () => { box.hidden = true; active = -1; };

    function run() {
      const q = input.value.trim().toLowerCase();
      if (!q) { close(); return; }
      results = FLAT_LESSONS.filter(l =>
        l.title.toLowerCase().includes(q) ||
        l.summary.toLowerCase().includes(q) ||
        l.stage.toLowerCase().includes(q)
      );
      if (!results.length) {
        box.innerHTML = `<li class="empty">검색 결과 없음</li>`;
      } else {
        box.innerHTML = results.map((l, i) =>
          `<li data-id="${l.id}" data-i="${i}">
             <div>${esc(l.title)}</div>
             <div class="sr-stage">${esc(l.stage)}</div>
           </li>`).join("");
        $$("li", box).forEach(li => {
          li.addEventListener("click", () => { location.hash = li.dataset.id; input.value = ""; close(); });
        });
      }
      box.hidden = false; active = -1;
    }
    input.addEventListener("input", run);
    input.addEventListener("keydown", e => {
      const items = $$("li[data-id]", box);
      if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, items.length - 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); }
      else if (e.key === "Enter" && active >= 0) { items[active].click(); return; }
      else if (e.key === "Escape") { input.value = ""; close(); return; }
      items.forEach((it, i) => it.classList.toggle("active", i === active));
    });
    document.addEventListener("click", e => {
      if (!e.target.closest(".search-wrap")) close();
    });
  }

  /* ---------- 사이드바 토글(모바일) ---------- */
  function openSidebar() { $("#sidebar").classList.add("open"); $("#overlay").hidden = false; }
  function closeSidebar() { $("#sidebar").classList.remove("open"); $("#overlay").hidden = true; }

  /* ---------- 테마 ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("#themeToggle").textContent = t === "dark" ? "☀️" : "🌙";
    localStorage.setItem(STORE_THEME, t);
  }

  /* ---------- 라우팅 ---------- */
  function route() {
    const id = location.hash.replace(/^#/, "") || FLAT_LESSONS[0].id;
    const lessonView = $("#lessonView"), quizView = $("#quizView");
    if (id === "quiz") {
      lessonView.hidden = true;
      quizView.hidden = false;
      renderQuizPage();
    } else {
      quizView.hidden = true;
      lessonView.hidden = false;
      renderLesson(id);
    }
  }

  /* ---------- 초기화 ---------- */
  function init() {
    // 테마: 저장값 → OS 선호
    const savedTheme = localStorage.getItem(STORE_THEME) ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(savedTheme);

    buildNav();
    updateProgress();
    setupSearch();

    $("#themeToggle").addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      applyTheme(cur === "dark" ? "light" : "dark");
    });
    $("#menuToggle").addEventListener("click", openSidebar);
    $("#overlay").addEventListener("click", closeSidebar);

    $("#prevBtn").addEventListener("click", () => {
      if (currentIdx > 0) location.hash = FLAT_LESSONS[currentIdx - 1].id;
    });
    $("#nextBtn").addEventListener("click", () => {
      if (currentIdx < FLAT_LESSONS.length - 1) location.hash = FLAT_LESSONS[currentIdx + 1].id;
    });
    $("#completeBtn").addEventListener("click", () => {
      const id = FLAT_LESSONS[currentIdx].id;
      if (done.has(id)) done.delete(id); else done.add(id);
      setDone(done);
      updateLessonNav(currentIdx);
      refreshNavChecks();
      updateProgress();
    });
    $("#resetProgress").addEventListener("click", () => {
      if (!confirm("진행도를 모두 초기화할까요?")) return;
      done = new Set(); setDone(done);
      refreshNavChecks(); updateProgress(); updateLessonNav(currentIdx);
    });

    window.addEventListener("hashchange", route);
    route();
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
